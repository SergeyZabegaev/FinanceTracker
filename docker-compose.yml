version: '3.8'

services:
  web:
    build: .
    container_name: financetracker-app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # Порт не пробрасываем наружу, Nginx будет обращаться к нему по внутренней сети
    expose:
      - "8080"
    volumes:
      # Монтируем папку для хранения файла SQLite, чтобы данные не терялись при пересборке
      - ./data:/app/data

  nginx:
    image: nginx:latest
    container_name: financetracker-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web